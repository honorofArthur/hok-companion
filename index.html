<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Page setup -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title -->
  <title>Honor of Kings Items</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icon1.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icon1.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>



<body>

  <!-- ================================
       HEADER
  ================================= -->

  <header class="site-header">
    <h1>Honor of Kings Items</h1>
  </header>


  <!-- ================================
       MAIN PAGE CONTENT
  ================================= -->

  <main class="page">


    <!-- ================================
         CATEGORY FILTERS
    ================================= -->

    <section class="controls">
      <div class="category-row">

        <button class="category-button all active" data-category="All">
          <span>All Items</span>
        </button>

        <button class="category-button physical" data-category="Physical Attack">
          <span>Physical Attack Items</span>
        </button>

        <button class="category-button spell" data-category="Spell Attack">
          <span>Spell Attack Items</span>
        </button>

        <button class="category-button defence" data-category="Defence">
          <span>Defence Items</span>
        </button>

        <button class="category-button jungling" data-category="Jungling">
          <span>Jungling Items</span>
        </button>

        <button class="category-button roaming" data-category="Roaming">
          <span>Roaming Items</span>
        </button>

        <button class="category-button movement" data-category="Movement">
          <span>Movement Items</span>
        </button>

      </div>
    </section>


<!-- ================================
     SORT PANEL
================================ -->
<section class="sort-panel">

  <div class="sort-top-row">
    <span class="sort-title">Sort</span>

    <button
      class="reset-filters-button"
      id="reset-filters-button"
      type="button">
      Reset
    </button>
  </div>


  <div class="sort-controls-row">

    <div class="sort-field">
      <label for="primary-sort-stat">Primary Stat</label>

      <select id="primary-sort-stat">
        <option value="cost">Cost</option>
        <option value="physicalAttack">Physical Attack</option>
        <option value="spellAttack">Spell Attack</option>
        <option value="attackSpeed">Attack Speed</option>
        <option value="critChance">Crit Chance</option>
        <option value="critDamage">Crit Damage</option>
        <option value="maxHp">Max HP</option>
        <option value="maxMana">Max Mana</option>
        <option value="physicalDefense">Physical Defense</option>
        <option value="spellDefense">Spell Defense</option>
        <option value="movementSpeed">Movement Speed</option>
        <option value="cdr">CDR</option>
        <option value="physicalLifesteal">Physical Lifesteal</option>
        <option value="spellLifesteal">Spell Lifesteal</option>
        <option value="tenacity">Tenacity</option>
      </select>
    </div>


    <div class="sort-field">
      <label for="secondary-sort-stat">Secondary Stat</label>

      <select id="secondary-sort-stat">
        <option value="">None</option>
        <option value="physicalAttack">Physical Attack</option>
        <option value="spellAttack">Spell Attack</option>
        <option value="attackSpeed">Attack Speed</option>
        <option value="critChance">Crit Chance</option>
        <option value="critDamage">Crit Damage</option>
        <option value="maxHp">Max HP</option>
        <option value="maxMana">Max Mana</option>
        <option value="physicalDefense">Physical Defense</option>
        <option value="spellDefense">Spell Defense</option>
        <option value="movementSpeed">Movement Speed</option>
        <option value="cdr">CDR</option>
        <option value="physicalLifesteal">Physical Lifesteal</option>
        <option value="spellLifesteal">Spell Lifesteal</option>
        <option value="tenacity">Tenacity</option>
      </select>
    </div>


    <div class="sort-field">
      <label for="sort-direction">Order</label>

      <select id="sort-direction">
        <option value="desc">High → Low</option>
        <option value="asc">Low → High</option>
      </select>
    </div>

  </div>



</section>

<!-- ================================
     ITEM DATABASE LAYOUT
================================= -->

<div class="database-layout">

  <section id="item-list" class="item-grid">
    <!-- JavaScript will place item cards here -->
  </section>

  <div class="compare-zone">
    <button id="compare-button" class="compare-button" type="button">
      Compare Selected Item
    </button>

    <div class="compare-layout">
      <aside class="item-inspector" id="item-inspector"></aside>
      <aside class="compare-inspector" id="compare-inspector"></aside>
    </div>
  </div>

</div>

</main>



  <!-- ================================
       JAVASCRIPT
  ================================= -->

<script src="tags.js"></script>
<script src="items.js"></script>
<script src="script.js"></script>
<div class="mobile-inspector-backdrop" id="mobile-inspector-backdrop"></div>
</body>

</html>
